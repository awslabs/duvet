source = { local = true }
cmd = ["duvet query -c coverage -r *.xml -f jacoco-xml --verbose"]
report_output = false

# Implication (and exception) coverers are quote-tiling only: they are
# NOT held to the witness-executed correlation (design/witness/spec.md
# §1.6 discharge applies to implementation annotations — an implication
# asserts "fundamentally true or not testable", so there is nothing a
# witness could execute; holding it to executed(I, w) is a category
# error and made cross-crate implication staging impossible — the
# W2/W3/W6 dogfood finding, design/witness/dogfood.md).
#
# Shape: section-1's quote is covered by an implication whose lines are
# never executed in the coverage report, plus an executed citation. The
# citation is held to the check (and passes); the implication is
# exempt. section-2's quote is covered ONLY by a non-executed
# implication: the pair still discharges, because the test bound its
# witness and no citation coverer failed.
#
# Expected: PASS with 2 successful correlations. Before the fix the
# engine held the implications to executed(I, w) and failed both.

[[file]]
path = ".duvet/config.toml"
contents = """
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "src/**/*.java"

[[specification]]
source = "spec.md"
"""

[[file]]
path = "spec.md"
contents = """
# Test Specification

## Section 1

This MUST be implemented and checked

## Section 2

This MUST hold by construction

"""

[[file]]
path = "src/main/java/com/example/Impl.java"
contents = """
package com.example;

public class Impl {

    public static int implemented() {
        //= spec.md#section-1
        //= type=implementation
        //# This MUST be implemented and checked
        return 1; // line 9: executed
    }

    public static int neverRuns() {
        //= spec.md#section-1
        //= type=implication
        //# This MUST be implemented and checked
        return 2; // line 16: NOT executed
    }

    public static int alsoNeverRuns() {
        //= spec.md#section-2
        //= type=implication
        //# This MUST hold by construction
        return 3; // line 23: NOT executed
    }
}

"""

[[file]]
path = "src/test/java/com/example/ImplTest.java"
contents = """
package com.example;

import org.junit.Test;
import static org.junit.Assert.*;

public class ImplTest {

    @Test
    public void testImplemented() {
        //= spec.md#section-1
        //= type=test
        //# This MUST be implemented and checked

        assertEquals(1, Impl.implemented()); // line 14: executed
    }

    @Test
    public void testByConstruction() {
        //= spec.md#section-2
        //= type=test
        //# This MUST hold by construction

        assertTrue(true); // line 23: executed
    }
}
"""

