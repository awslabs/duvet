source = { local = true }
cmd = ["duvet query -c coverage --coverage-source verus-sst=../../../duvet/src/query/parsers/verus_sst/testdata/vacuity"]
report_output = false

# Spec §3's static unwitnessed split, prose-displaced arm: an ordinary
# comment interleaved between the annotation block and the code becomes
# the resolved target under degraded resolution (the comment line is
# unclassified, so the walk stops on it). Both roles are pinned:
#
#   - the test annotation's doc-prose target is reported UNWITNESSABLE
#     (comment-line kind), quoting the offending line — instead of the
#     run-dependent W6 unwitnessed report;
#   - the implementation annotation's interleaved-comment target gets
#     the same static finding with the implementation-flavored headline
#     (spec §3's implementation clause) — previously fully silent: an
#     implementation annotation is never reported unwitnessed, so its
#     placement defect could only surface as a failed correlation in
#     some future witnessed run.
[[file]]
path = ".duvet/config.toml"
contents = """
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "*.rs"

[[specification]]
source = "spec.md"
"""

[[file]]
path = "runtime.rs"
contents = """
//= spec.md#section-1
//# This MUST do the thing
// helper shared by both paths
fn do_thing() {
    run();
}

//= spec.md#section-1
//= type=test
//# This MUST do the thing
/// Exercises do_thing end to end.
fn test_do_thing() {
    do_thing();
}
"""

[[file]]
path = "spec.md"
contents = """
# Test Specification

## Section 1

This MUST do the thing
"""
