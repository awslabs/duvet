source = { local = true }
cmd = ["duvet query -c coverage -r lcov.info -f lcov"]
report_output = false

# Negative end-to-end case for `-f lcov` (design/lcov-parser/spec.md §2): a
# malformed tracefile — here a near-miss `end_of_record` with a trailing
# space, the silent-structural-corruption case of decisions.md Decision 9 —
# must fail the query with a diagnostic naming the tracefile line, not
# silently fold the next block's DA records into the previous file. Pins the
# CoverageError -> CLI error propagation path that the unit tests cannot see.
[[file]]
path = ".duvet/config.toml"
contents = """
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "src/**/*.rs"

[[specification]]
source = "spec.md"
"""

[[file]]
path = "src/lib.rs"
contents = """
//= spec.md#section-1
//= type=implementation
//# This MUST do X
fn work() {}
"""

[[file]]
path = "spec.md"
contents = """
# Test Specification

## Section 1

This MUST do X
"""

[[file]]
path = "lcov.info"
contents = """
SF:src/lib.rs
DA:4,1
end_of_record 
SF:src/other.rs
DA:1,1
end_of_record
"""
