source = { local = true }
cmd = ["duvet query -c coverage --coverage-source verus-sst=../../../duvet/src/query/parsers/verus_sst/testdata/vacuity --verbose"]
report_output = false

# Proof-witness discharge (design/witness/spec.md W1, W2, §3, §5).
#
# The coverage source is the CHECKED-IN Verus SST golden fixture, referenced
# by a path relative to this test's working directory
# (target/integration/<name>/ -> repo root is ../../..). The source file
# below is that fixture's vacuity.rs with two banner-comment runs replaced
# 1:1 by duvet annotations — LINE-COUNT PRESERVING, because the checked-in
# SST log's spans are line-keyed against the original file. If you move or
# regenerate testdata/vacuity, this test fails loudly; keep the annotation
# swap line-for-line (2 comment lines -> 2-line impl annotation, 3 comment
# lines -> 3-line test annotation) so every span still points at the same
# code. The producer unit test
# integration_tomls_embed_line_true_copies_of_the_fixture
# (verus_sst/tests.rs) pins this parity and fails first, with a precise
# message, when the fixture and the embedded copies drift.
#
# The test annotation's resolved target is honest_proof's signature line
# (24), which is exactly the obligation's (signature-only) extent, so the
# witness binds ByRootSpan. honest_proof's ensures references spec_add_one,
# so the obligation-graph closure reaches spec_add_one's spans (line 9),
# where the implementation annotation resolves: one single witness saw both
# sides, and the pair is discharged at strength CONSULTED (Decision 7) by a
# proof that executed nothing. The verbose verdict must name the
# discharging witness: "discharged by vacuity::honest_proof (consulted)"
# (spec §3).
#
# Note: since Decision 18, honest_proof's ensures line (25) roots its own
# clause unit, so an annotation there would exercise a clause-rooted
# discharge ("vacuity::honest_proof ensures[0]"). This test deliberately
# stays on the signature extent — clause-grain rooting is pinned by the
# producer unit tests (verus_sst/tests.rs, scenario_3 and the labels test).
[[file]]
path = ".duvet/config.toml"
contents = """
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "*.rs"

[[specification]]
source = "spec.md"
"""

[[file]]
path = "vacuity.rs"
contents = """
// Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
// SPDX-License-Identifier: Apache-2.0
use vstd::prelude::*;

verus! {

//= spec.md#add-one
//# Adding one MUST produce the successor
pub open spec fn spec_add_one(x: int) -> int {
    x + 1
}

pub fn add_one(x: u32) -> (r: u32)
    requires x < 1000,
    ensures r == spec_add_one(x as int),
{
    let r = x + 1;
    r
}

//= spec.md#add-one
//= type=test
//# Adding one MUST produce the successor
pub proof fn honest_proof()
    ensures forall|x: int| spec_add_one(x) == x + 1,
{
}

// ---- Scenario B: vacuous proof, never mentions the impl ------------
// requires false; ensures something absurd. Never references add_one.
// Expected (user hypothesis, case 1): tiny closure, no impl spans.
pub proof fn vacuous_proof(x: int)
    requires x != x,
    ensures x == x + 1,
{
}

// ---- Scenario B2: vacuous proof that MENTIONS the impl -------------
// requires false, but the ensures references spec_add_one.
// Discriminates elaboration-record vs needed-record semantics:
// if SST records what elaboration touched, spec_add_one appears here
// even though the solver needed nothing.
pub proof fn vacuous_proof_mentioning(x: int)
    requires x != x,
    ensures spec_add_one(x) == x - 100,
{
}

// ---- Scenario C: the user's scenario --------------------------------
// Impl annotation inside THIS function's body (line with `let y`);
// test annotation on the vacuously-true ensures.
// Question: does the fn-level witness closure include its own body
// (self-inclusion), discharging the pair despite vacuity?
pub fn self_contained(x: u32) -> (r: u32)
    ensures x != x ==> r == 999,
{
    let y = x;
    y
}

// ---- Scenario D: unit labels from the artifact ----------------------
// A loop with a proof_note'd invariant and a proof_note'd assert,
// plus unnoted siblings. Pins Decision 20 label extraction:
// ProofNoteLabel text when recorded, span identity otherwise.
pub fn noted_loop(n: u32) -> (r: u32)
    requires n <= 100,
    ensures r <= 100,
{
    let mut i: u32 = 0;
    while i < n
        invariant
            #[verifier::proof_note("i stays bounded")]
            i <= n,
            n <= 100,
        decreases n - i,
    {
        i = i + 1;
    }
    proof {
        #[verifier::proof_note("loop exit bound")]
        assert(i <= 100);
        assert(i >= 0);
    }
    i
}

// ---- Scenario E: fills are span-start-line sets (Decision 23) -------
// An interior comment line inside a VERIFIED fn is not an AST node,
// so no span begins on it and it appears in no witness's fill — the
// extent sweep marked it Hit. The unverified `main` below the verus!
// block is the same fact at file grain: no SST record, no fill, ever.
pub fn commented_body(x: u32) -> (r: u32)
    ensures r >= x,
{
    let a = x;
    // interior comment: this line must appear in no witness's fill
    let b = a;
    b
}

} // verus!

fn main() {}
"""

