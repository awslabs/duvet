source = { local = true }
cmd = ["duvet query -c coverage --coverage-source verus-sst=../../../duvet/src/query/parsers/verus_sst/testdata/vacuity"]
report_output = false

# Spec §3's static unwitnessed split, attribute-displaced arm: the test
# annotation below is followed by `#[test]`, so degraded resolution (no
# `.rs` classifier; only blank and annotation lines are skippable)
# resolves its target onto the attribute line — a line no act of
# checking can ever be about, in any run. The verdict identifies the
# annotation as UNWITNESSABLE, quotes the offending `#[test]` line
# (matched by the Rust default non-target pattern `^\s*#\[`), and cites
# the placement rule — distinct from the W6 unwitnessed report, which
# this run would otherwise have produced (no producer witnesses
# runtime.rs; wording pinned by query-witness-w6-unwitnessed.toml).
#
# The implementation annotation on `run();` resolves onto code and is
# NOT reported: the split is placement-selective, not file-wide.
[[file]]
path = ".duvet/config.toml"
contents = """
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "*.rs"

[[specification]]
source = "spec.md"
"""

[[file]]
path = "runtime.rs"
contents = """
fn do_thing() {
    //= spec.md#section-1
    //# This MUST do the thing
    run();
}

//= spec.md#section-1
//= type=test
//# This MUST do the thing
#[test]
fn test_do_thing() {
    do_thing();
}
"""

[[file]]
path = "spec.md"
contents = """
# Test Specification

## Section 1

This MUST do the thing
"""
