source = { local = true }
cmd = ["duvet query -c coverage -r report-a.xml -r report-b.xml -f jacoco-xml"]
report_output = false

# EXPECTATION FLIPPED by Decision 14 (design/witness/decisions.md;
# spec §1.6/W1 universal discharge). Fixture data unchanged.
#
# One implementation + one test annotate the same spec text. Two reports both
# show the test executed; report A shows the implementation executed, report B
# shows it missed. The test therefore BINDS both witnesses, and the verdict is
# universal: every bound witness must execute the implementation. Report B is
# a bound claim that never reached the implementation — a per-run vacuity —
# so the pair must FAIL, and the output must show the per-witness
# disagreement (✓ report-a / ✗ report-b), never silently.
#
# Under the previous ∃-semantics (report A alone discharges; extra reports
# cannot cause failure) this test pinned a PASS. Decision 14 rejects exactly
# that masking: a passing witness must not outvote a bound witness that
# failed. The old concern this test guarded — double-counting one test into
# both `successful` and `failed` — remains pinned: the test appears exactly
# once, as one failed correlation.
#
# Contrast with query-coverage-cross-report-pair.toml, where NO single report
# witnesses both sides and the check must also fail.
[[file]]
path = ".duvet/config.toml"
contents = """
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "src/**/*.java"

[[specification]]
source = "spec.md"
"""

[[file]]
path = "src/main/java/com/example/Impl.java"
contents = """
package com.example;

public class Impl {
    public void doThing() {
        //= spec.md#section-1
        //= type=implementation
        //# This MUST do the thing
        run();
    }
}
"""

[[file]]
path = "src/test/java/com/example/ImplTest.java"
contents = """
package com.example;

public class ImplTest {
    public void testThing() {
        //= spec.md#section-1
        //= type=test
        //# This MUST do the thing
        new Impl().doThing();
    }
}
"""

[[file]]
path = "spec.md"
contents = """
# Test Specification

## Section 1

This MUST do the thing
"""

# report A: implementation line (Impl.java:8) executed; test line executed
[[file]]
path = "report-a.xml"
contents = """
<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!DOCTYPE report PUBLIC "-//JACOCO//DTD Report 1.1//EN" "report.dtd">
<report name="A">
    <package name="com/example">
        <sourcefile name="Impl.java">
            <line nr="8" mi="0" ci="3" mb="0" cb="0"/>
        </sourcefile>
        <sourcefile name="ImplTest.java">
            <line nr="8" mi="0" ci="3" mb="0" cb="0"/>
        </sourcefile>
    </package>
</report>
"""

# report B: implementation line MISSED; test line executed
[[file]]
path = "report-b.xml"
contents = """
<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!DOCTYPE report PUBLIC "-//JACOCO//DTD Report 1.1//EN" "report.dtd">
<report name="B">
    <package name="com/example">
        <sourcefile name="Impl.java">
            <line nr="8" mi="3" ci="0" mb="0" cb="0"/>
        </sourcefile>
        <sourcefile name="ImplTest.java">
            <line nr="8" mi="0" ci="3" mb="0" cb="0"/>
        </sourcefile>
    </package>
</report>
"""
