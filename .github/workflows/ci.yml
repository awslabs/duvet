on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  schedule:
    # run every morning at 10am Pacific Time
    - cron: '0 17 * * *'

name: ci

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # Pin the nightly toolchain to prevent breakage.
  # This should be occasionally updated.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2025-11-09

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      rust-versions: ${{ steps.definitions.outputs.versions }}
      msrv: ${{ steps.definitions.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate definitions
        id: definitions
        run: |
          rustup show active-toolchain
          export MSRV=$(rustup show active-toolchain | awk -F'-' '{print $1}')
          if [ -z "$MSRV" ]; then
            echo "Error: MSRV did not parse correctly"
            exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          export RAW_VERSIONS="stable beta $RUST_NIGHTLY_TOOLCHAIN $MSRV"
          export VERSIONS=$(echo $RAW_VERSIONS | jq -scR 'rtrimstr("\n")|split(" ")|.')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal --component rustfmt
          rustup override set ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - name: Install clippy toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable

      - name: Run checks
        run: |
          cargo xtask checks --rustfmt-toolchain ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - uses: camshaft/rust-cache@v1

      - uses: camshaft/install@v1
        with:
          crate: cargo-udeps

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build script.js
        run: |
          cargo xtask build

      - name: Run cargo udeps
        run: cargo udeps --workspace --all-targets
        env:
          RUSTC_WRAPPER: ""

  test:
    runs-on: ${{ matrix.os }}
    needs: env
    strategy:
      matrix:
        rust: ${{ fromJson(needs.env.outputs.rust-versions) }}
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }}
          rustup override set ${{ matrix.rust }}

      - uses: camshaft/rust-cache@v1
        with:
          key: ${{ matrix.target }}

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Run tests
        run: |
          cargo xtask test

  verify: # verify the duvet-coverage Verus proofs
    name: Verify duvet-coverage proofs
    runs-on: ubuntu-latest
    env:
      # Verus release pinned for reproducibility. Bump when the matching
      # vstd version on crates.io advances; the corresponding Rust toolchain
      # is installed dynamically below by parsing the verus binary's
      # missing-toolchain error message.
      #
      # Releases live at https://github.com/verus-lang/verus/releases
      VERUS_VERSION: "0.2026.05.24.ecee80a"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Verus binary
        id: cache-verus
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus binary release
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          curl -L --fail \
            -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip
          mv verus-x86-linux .verus

      - name: Add Verus to PATH
        run: echo "${{ github.workspace }}/.verus" >> "$GITHUB_PATH"

      - name: Install Rust toolchain required by Verus
        run: |
          # Verus pins a specific Rust toolchain per release; install exactly
          # that one, otherwise `cargo verus build` only sees the repo's pinned
          # toolchain and aborts with "required rust toolchain <ver> not found".
          # `verus --version` reports the toolchain (on its `Toolchain:` line,
          # or in the not-found error). Capture defensively: under
          # `bash -eo pipefail`, verus exiting non-zero when its toolchain is
          # missing would otherwise abort this step. Extract by pattern so it
          # works regardless of message format and across VERUS_VERSION bumps.
          ver_out=$(verus --version 2>&1 || true)
          echo "$ver_out"
          TOOLCHAIN=$(printf '%s\n' "$ver_out" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' \
            | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "Could not determine Verus's required toolchain" >&2
            exit 1
          fi
          echo "Installing Verus-required toolchain: $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN"

      - name: Verify duvet-coverage proofs
        # `--features verify` pulls in vstd, which is verification-only and
        # optional so it stays out of the published dependency graph.
        # `--log vir-sst` makes the verification run leave its SST record
        # behind; the dogfood job's witness query consumes it. Same proof
        # run, no second verification.
        run: cargo verus build -p duvet-coverage --features verify -- --log vir-sst --log-dir verus-sst-logs

      - name: Compress SST logs
        # duvet's verus-sst producer reads *-sst.vir.gz transparently and
        # the SST text compresses ~21:1 (measured on the checked-in golden
        # corpus), so ship the artifact gzipped.
        run: gzip -9 verus-sst-logs/*-sst.vir

      - name: Upload SST logs for the witness-query dogfood
        uses: actions/upload-artifact@v6
        with:
          name: verus-sst-logs
          path: verus-sst-logs/
          if-no-files-found: error

  action: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      - name: duvet help
        run: duvet --help
      - name: duvet report
        run: duvet report

  dogfood: # duvet runs on itself: the branch-built duvet checks the repo's own
    # requirement annotations against .duvet/config.toml. `report --ci`
    # compares the freshly generated snapshot against the committed
    # .duvet/snapshot.txt and fails on any drift. The snapshot pins the
    # per-line coverage state of every registered spec (including the
    # witness spec's MUST lines), so a coverage regression — or an
    # unintended new citation — fails this job; improving coverage
    # requires regenerating and committing the snapshot.
    #
    # The witness-query step then dogfoods the coverage check itself: it
    # feeds the SST logs the `verify` job left behind to
    # `duvet query -c coverage`, sliced to the witness properties
    # (W1–W7, P1–P4), and gates on every property pair discharging.
    # The full (unsliced) proof-only run is NOT gated here: the runtime
    # `type=test` annotations are unwitnessed in a proof-only run by
    # design (design/witness/dogfood.md defers that gate to the LCOV
    # follow-up).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install stable
          rustup override set stable

      - uses: camshaft/rust-cache@v1

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build duvet
        run: |
          cargo xtask build

      - name: Run duvet on its own annotations
        run: ./target/debug/duvet report --ci

      - name: Download Verus SST logs
        uses: actions/download-artifact@v6
        with:
          name: verus-sst-logs
          path: verus-sst-logs

      - name: Witness query dogfood
        # Gated: every witness-property pair (proof fn ↔ implementation)
        # must discharge from the proof witnesses. Exit code is the gate —
        # a failed correlation fails the job.
        run: |
          ./target/debug/duvet query -c coverage \
            --coverage-source verus-sst=verus-sst-logs \
            -s "design/witness/spec.md#property-w1-same-witness-discharge,design/witness/spec.md#property-w2-test-execution,design/witness/spec.md#property-w3-global-execution,design/witness/spec.md#property-w4-monotonicity,design/witness/spec.md#property-w5-claim-refinement,design/witness/spec.md#property-w6-unwitnessed-test-annotations,design/witness/spec.md#property-w7-positional-binding-map-independence,design/witness/producer-core-spec.md#property-p1-closure-fixpoint,design/witness/producer-core-spec.md#property-p2-most-specific-wins,design/witness/producer-core-spec.md#property-p3-witness-assembly,design/witness/producer-core-spec.md#property-p4-filter-soundness"
