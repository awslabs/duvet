on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  schedule:
    # run every morning at 10am Pacific Time
    - cron: '0 17 * * *'

name: ci

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # Pin the nightly toolchain to prevent breakage.
  # This should be occasionally updated.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2025-11-09

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      rust-versions: ${{ steps.definitions.outputs.versions }}
      msrv: ${{ steps.definitions.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate definitions
        id: definitions
        run: |
          export MSRV=$(grep -m1 '^rust-version' duvet/Cargo.toml | sed -E 's/^rust-version *= *"(.+)"/\1/')
          if [ -z "$MSRV" ]; then
            echo "Error: MSRV did not parse correctly from duvet/Cargo.toml"
            exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          export RAW_VERSIONS="stable beta $RUST_NIGHTLY_TOOLCHAIN $MSRV"
          export VERSIONS=$(echo $RAW_VERSIONS | jq -scR 'rtrimstr("\n")|split(" ")|.')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal --component rustfmt
          rustup override set ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - name: Install clippy toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable

      - name: Run checks
        run: |
          cargo xtask checks --rustfmt-toolchain ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - uses: camshaft/rust-cache@v1

      - uses: camshaft/install@v1
        with:
          crate: cargo-udeps

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build script.js
        run: |
          cargo xtask build

      - name: Run cargo udeps
        run: cargo udeps --workspace --all-targets
        env:
          RUSTC_WRAPPER: ""

  test:
    runs-on: ${{ matrix.os }}
    needs: env
    strategy:
      matrix:
        rust: ${{ fromJson(needs.env.outputs.rust-versions) }}
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }}
          rustup override set ${{ matrix.rust }}

      - uses: camshaft/rust-cache@v1
        with:
          key: ${{ matrix.target }}

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Run tests
        run: |
          cargo xtask test

  verify: # verify the duvet-coverage Verus proofs
    name: Verify duvet-coverage proofs
    runs-on: ubuntu-latest
    env:
      # Verus release pinned for reproducibility. Bump when the matching
      # vstd version on crates.io advances; the corresponding Rust toolchain
      # is installed dynamically below by parsing the verus binary's
      # missing-toolchain error message.
      #
      # Releases live at https://github.com/verus-lang/verus/releases
      VERUS_VERSION: "0.2026.05.24.ecee80a"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Verus binary
        id: cache-verus
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus binary release
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          curl -L --fail \
            -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip
          mv verus-x86-linux .verus

      - name: Add Verus to PATH
        run: echo "${{ github.workspace }}/.verus" >> "$GITHUB_PATH"

      - name: Install Rust toolchain required by Verus
        run: |
          # Verus pins a specific Rust toolchain per release; install exactly
          # that one, otherwise `cargo verus build` only sees the repo's pinned
          # toolchain and aborts with "required rust toolchain <ver> not found".
          # `verus --version` reports the toolchain (on its `Toolchain:` line,
          # or in the not-found error). Capture defensively: under
          # `bash -eo pipefail`, verus exiting non-zero when its toolchain is
          # missing would otherwise abort this step. Extract by pattern so it
          # works regardless of message format and across VERUS_VERSION bumps.
          ver_out=$(verus --version 2>&1 || true)
          echo "$ver_out"
          TOOLCHAIN=$(printf '%s\n' "$ver_out" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' \
            | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "Could not determine Verus's required toolchain" >&2
            exit 1
          fi
          echo "Installing Verus-required toolchain: $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN"

      - name: Verify duvet-coverage proofs
        # `--features verify` pulls in vstd, which is verification-only and
        # optional so it stays out of the published dependency graph.
        run: cargo verus build -p duvet-coverage --features verify

  action: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      - name: duvet help
        run: duvet --help
      - name: duvet report
        run: duvet report

  dogfood: # duvet runs on itself: the branch-built duvet checks the repo's own
    # requirement annotations against .duvet/config.toml. `report --ci`
    # compares the freshly generated snapshot against the committed
    # .duvet/snapshot.txt and fails on any drift; the annotation checks
    # are judged by exit code alone — no output parsing, no thresholds,
    # no expected-failure lists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install stable
          rustup override set stable

      - uses: camshaft/rust-cache@v1

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build duvet
        run: |
          cargo xtask build

      - name: Run duvet on its own annotations
        # Snapshot gate: any coverage regression — or an unintended new
        # citation — drifts the generated snapshot from the committed one
        # and fails this step; improving coverage requires regenerating
        # and committing the snapshot.
        run: ./target/debug/duvet report --ci

      - name: Annotation checks
        # Tree-wide invariant, plain customer invocation: every spec
        # requirement carries an implementation annotation, every
        # implementation annotation carries a test annotation, and no
        # (type, quote) pair has more than one owner.
        run: ./target/debug/duvet query -c implementation,test,duplicates

  witnesses: # produce the per-test coverage witnesses: every #[test] in the
    # workspace runs in its own process and exports its own LCOV
    # tracefile (design/lcov-parser/decisions.md Decision 12). The
    # tracefiles are uploaded as artifacts — they ARE the per-test
    # witnesses, durable evidence of what each test executed. The
    # coverage gate itself runs in witness-gate below, over the union
    # of all shards.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup override set stable

      - uses: camshaft/rust-cache@v1
        with:
          key: witnesses

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Produce per-test witnesses
        run: |
          cargo xtask witnesses --total-workers 4 --worker-number ${{ matrix.worker }}

      - name: Upload witnesses
        uses: actions/upload-artifact@v4
        with:
          name: witnesses-${{ matrix.worker }}
          path: witnesses/*.info
          if-no-files-found: error

  witness-gate: # the coverage dogfood gate: duvet's own test annotations must
    # correlate with their claimed implementations inside a single
    # per-test witness (same-witness discharge, design/query/
    # decisions.md Decision 13). Runs over the union of all witness
    # shards; fails if any test annotation's implementation was not
    # executed by that test's own process.
    runs-on: ubuntu-latest
    needs: witnesses
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install stable
          rustup override set stable

      - uses: camshaft/rust-cache@v1

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build duvet
        run: |
          cargo xtask build

      - name: Download witnesses
        uses: actions/download-artifact@v4
        with:
          pattern: witnesses-*
          path: witnesses
          merge-multiple: true

      - name: Coverage gate
        # Never merge the witness files: duvet's LCOV parser sums across
        # blocks (spec.md §7 Property 4 proves the aggregation forgets
        # block structure), so a merged file collapses the per-test
        # partition back to co-coverage. The glob feeds each file as its
        # own witness.
        #
        # Scoped to the lcov-parser spec: its requirements are all
        # discharged by runtime code and runtime tests, so every pair is
        # dischargeable by a tracefile witness. The coverage-model spec's
        # annotations anchor on Verus proof fns and `ensures` clauses —
        # ghost code, erased at compile time, absent from every tracefile
        # by construction. Their witness is the prover (CI's verify job),
        # not a tracefile; they join this gate when prover-obligation
        # witnesses exist (design/witness/spec.md).
        run: ./target/debug/duvet query -c coverage -s design/lcov-parser/spec.md -r 'witnesses/*.info' -f lcov
