on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  schedule:
    # run every morning at 10am Pacific Time
    - cron: '0 17 * * *'

name: ci

# Least-privilege GITHUB_TOKEN for every job: nothing in this workflow
# writes to the repository. `actions: read` is required by
# actions/download-artifact to fetch the verus-sst-logs artifact
# through the API in the dogfood job.
permissions:
  actions: read
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # Pin the nightly toolchain to prevent breakage.
  # This should be occasionally updated.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2025-11-09

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      rust-versions: ${{ steps.definitions.outputs.versions }}
      msrv: ${{ steps.definitions.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate definitions
        id: definitions
        run: |
          rustup show active-toolchain
          export MSRV=$(rustup show active-toolchain | awk -F'-' '{print $1}')
          if [ -z "$MSRV" ]; then
            echo "Error: MSRV did not parse correctly"
            exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          export RAW_VERSIONS="stable beta $RUST_NIGHTLY_TOOLCHAIN $MSRV"
          export VERSIONS=$(echo $RAW_VERSIONS | jq -scR 'rtrimstr("\n")|split(" ")|.')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal --component rustfmt
          rustup override set ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - name: Install clippy toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable

      - name: Run checks
        run: |
          cargo xtask checks --rustfmt-toolchain ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - uses: camshaft/rust-cache@v1

      - uses: camshaft/install@v1
        with:
          crate: cargo-udeps

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build script.js
        run: |
          cargo xtask build

      - name: Run cargo udeps
        run: cargo udeps --workspace --all-targets
        env:
          RUSTC_WRAPPER: ""

  test:
    runs-on: ${{ matrix.os }}
    needs: env
    strategy:
      matrix:
        rust: ${{ fromJson(needs.env.outputs.rust-versions) }}
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }}
          rustup override set ${{ matrix.rust }}

      - uses: camshaft/rust-cache@v1
        with:
          key: ${{ matrix.target }}

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Run tests
        run: |
          cargo xtask test

  verify: # verify the duvet-coverage Verus proofs
    name: Verify duvet-coverage proofs
    runs-on: ubuntu-latest
    env:
      # Verus release pinned for reproducibility. Bump when the matching
      # vstd version on crates.io advances; the corresponding Rust toolchain
      # is installed dynamically below by parsing the verus binary's
      # missing-toolchain error message.
      #
      # Releases live at https://github.com/verus-lang/verus/releases
      VERUS_VERSION: "0.2026.05.24.ecee80a"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Verus binary
        id: cache-verus
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus binary release
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          curl -L --fail \
            -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip
          mv verus-x86-linux .verus

      - name: Add Verus to PATH
        run: echo "${{ github.workspace }}/.verus" >> "$GITHUB_PATH"

      - name: Install Rust toolchain required by Verus
        run: |
          # Verus pins a specific Rust toolchain per release; install exactly
          # that one, otherwise `cargo verus build` only sees the repo's pinned
          # toolchain and aborts with "required rust toolchain <ver> not found".
          # `verus --version` reports the toolchain (on its `Toolchain:` line,
          # or in the not-found error). Capture defensively: under
          # `bash -eo pipefail`, verus exiting non-zero when its toolchain is
          # missing would otherwise abort this step. Extract by pattern so it
          # works regardless of message format and across VERUS_VERSION bumps.
          ver_out=$(verus --version 2>&1 || true)
          echo "$ver_out"
          TOOLCHAIN=$(printf '%s\n' "$ver_out" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' \
            | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "Could not determine Verus's required toolchain" >&2
            exit 1
          fi
          echo "Installing Verus-required toolchain: $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN"

      - name: Verify duvet-coverage proofs
        # `--features verify` pulls in vstd, which is verification-only and
        # optional so it stays out of the published dependency graph.
        # `--log vir-sst` makes the verification run leave its SST record
        # behind; the dogfood job's witness query consumes it. Same proof
        # run, no second verification.
        #
        # This step is the test side of the "MUST be proven with Verus"
        # obligations: it fails unless every property in the verified crate
        # proves. The implementation side lives in the proof files
        # (duvet-coverage/src/{witness,producer_core,degraded,proofs}.rs).
        # These test annotations are discharged by this CI run itself, which
        # duvet's coverage machinery cannot consume — they stay unwitnessed
        # in the proof-only coverage table by design.
        #= design/witness/spec.md#engine-properties
        #= type=test
        #% These properties MUST be proven with Verus,
        #% as a new phase of the verified coverage model
        #% (the quantifier layer over the existing per-annotation cells).
        #= design/witness/producer-core-spec.md#producer-core-verified-model-properties
        #= type=test
        #% [spec.md §5.3](spec.md#discharge-unit)–[§5.5](spec.md#verus-producer)
        #% define what the Verus producer must do; this document states the
        #% properties that MUST be proven with Verus, as a new phase of the
        #% verified coverage model, over a verified model of the parsed
        #% obligation graph.
        #= design/query/coverage-model-spec.md#correctness-properties
        #= type=test
        #% These properties MUST be proven with Verus.
        #= design/query/coverage-model-spec.md#degraded-properties
        #= type=test
        #% These properties MUST be proven with Verus for the degraded path,
        #% alongside the Section 5 properties for the classified path.
        run: cargo verus build -p duvet-coverage --features verify -- --log vir-sst --log-dir verus-sst-logs

      - name: Compress SST logs
        # duvet's verus-sst producer reads *-sst.vir.gz transparently and
        # the SST text compresses ~21:1 (measured on the checked-in golden
        # corpus), so ship the artifact gzipped.
        run: gzip -9 verus-sst-logs/*-sst.vir

      - name: Upload SST logs for the witness-query dogfood
        uses: actions/upload-artifact@v6
        with:
          name: verus-sst-logs
          path: verus-sst-logs/
          if-no-files-found: error

  action: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      - name: duvet help
        run: duvet --help
      - name: duvet report
        run: duvet report

  dogfood: # duvet runs on itself: the branch-built duvet checks the repo's own
    # requirement annotations against .duvet/config.toml. `report --ci`
    # compares the freshly generated snapshot against the committed
    # .duvet/snapshot.txt and fails on any drift. The snapshot pins the
    # per-line coverage state of every registered spec (including the
    # witness spec's MUST lines), so a coverage regression — or an
    # unintended new citation — fails this job; improving coverage
    # requires regenerating and committing the snapshot.
    #
    # The witness-query step then dogfoods the coverage check itself: it
    # feeds the SST logs the `verify` job left behind to
    # `duvet query -c coverage`, sliced to the witness properties
    # (W1–W7, P1–P4), and gates on every property pair discharging.
    # The full (unsliced) proof-only run is gated only on its
    # unwitnessable count (zero placement defects tree-wide); its
    # discharge verdict is NOT gated: the runtime `type=test`
    # annotations are unwitnessed in a proof-only run by design (the
    # LCOV mixed-coverage producer is the follow-up that expands this
    # floor).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install stable
          rustup override set stable

      - uses: camshaft/rust-cache@v1

      - name: Cache node_modules
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: duvet/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('duvet/www/package-lock.json') }}

      - name: Build duvet
        run: |
          cargo xtask build

      - name: Run duvet on its own annotations
        # Test side of "proof files MUST carry duvet annotations": the
        # snapshot pins every proof-file citation's coverage state, so
        # removing citations from the proof files drifts the snapshot and
        # fails this step. The implementation side is the [[source]]
        # entries in .duvet/config.toml that put the proof files in the
        # scan. Discharged by this CI run itself — stays unwitnessed in
        # the coverage table by design.
        #
        # These MUST-carry tests are also the deletion-catching half of
        # the "MUST be proven with Verus" conjunction: the verify job
        # proves whatever is WRITTEN; deleting a specified property
        # removes its proof-file citation, which drifts the snapshot and
        # fails THIS step. (The MUST-prove quotes themselves are tested
        # once, on the verify step — duvet's duplicates check enforces
        # one test owner per quote.)
        #= design/witness/spec.md#engine-properties
        #= type=test
        #% The Verus proof files MUST carry duvet annotations citing the
        #% anchors in this section.
        #= design/witness/producer-core-spec.md#producer-core-verified-model-properties
        #= type=test
        #% The Verus proof files MUST carry duvet annotations citing the
        #% anchors in this document.
        run: ./target/debug/duvet report --ci

      - name: Download Verus SST logs
        uses: actions/download-artifact@v6
        with:
          name: verus-sst-logs
          path: verus-sst-logs

      - name: Witness query dogfood
        # Correlation floor: every test/implementation pair in the
        # witness-property slice must discharge against the proof
        # witnesses — plain exit 0, no thresholds, no expected failures.
        #
        # The engine-side implementation annotations for W2/W3/W6 were
        # removed (they structurally cannot be witnessed by a proof-only
        # run; see the commit that deleted dogfood-expected-failures.txt).
        # They return with the LCOV mixed-coverage producer, expanding
        # this floor toward the full specification set.
        run: |
          set -euo pipefail
          SECTIONS="design/witness/spec.md#property-w1-same-witness-discharge,design/witness/spec.md#property-w2-test-execution,design/witness/spec.md#property-w3-global-execution,design/witness/spec.md#property-w4-monotonicity,design/witness/spec.md#property-w5-claim-refinement,design/witness/spec.md#property-w6-unwitnessed-test-annotations,design/witness/spec.md#property-w7-positional-binding-map-independence,design/witness/producer-core-spec.md#property-p1-closure-fixpoint,design/witness/producer-core-spec.md#property-p2-most-specific-wins,design/witness/producer-core-spec.md#property-p3-witness-assembly,design/witness/producer-core-spec.md#property-p4-filter-soundness"

          ./target/debug/duvet query -c coverage \
            --coverage-source verus-sst=verus-sst-logs \
            -s "$SECTIONS"

      - name: Unwitnessable placement gate
        # Placement floor over the WHOLE tree: the sliced gate above
        # covers only the witness-property slice, so a new unwitnessable
        # placement elsewhere (an annotation whose resolved target is a
        # blank, comment, or attribute line — a defect no run can ever
        # witness; Decision 22) would otherwise pass CI. This runs the
        # full (unsliced) coverage query and asserts the static
        # unwitnessable verdict is zero, tree-wide. The unsliced run's
        # exit code is NOT the gate — its runtime type=test annotations
        # are unwitnessed in a proof-only run by design (Decision 8) —
        # the gate is the unwitnessable count alone: plain zero, no
        # thresholds, no expected-failure list.
        run: |
          set -euo pipefail
          out=$(./target/debug/duvet query -c coverage \
            --coverage-source verus-sst=verus-sst-logs 2>&1) || true
          # No `grep -q`: it exits at first match, SIGPIPEs the printf,
          # and pipefail turns that into a spurious 141.
          printf '%s\n' "$out" | grep -E '^\s*Unwitnessable targets:'
          printf '%s\n' "$out" | grep -E '^\s*Unwitnessable targets: 0$' > /dev/null
